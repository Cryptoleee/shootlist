<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<title>Shootlist</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="home-mode">
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <button id="backBtn" class="ghost-btn back-btn" title="Terug naar klussen">‹</button>
      <h1 id="appTitle">Shootlist</h1>
    </div>
    <button id="resetBtn" class="ghost-btn project-only" title="Alles resetten">Reset</button>
  </div>
  <div class="progress-wrap project-only">
    <div class="progress-text"><span id="progressText">0 / 0 vastgelegd</span> <span id="syncBadge" class="sync-badge"></span></div>
    <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
  </div>
  <nav class="tabs project-only">
    <button class="tab active" data-tab="list">Lijst</button>
    <button class="tab" data-tab="map">Plattegrond</button>
    <button class="tab" data-tab="timetable">Timetable</button>
    <button class="tab" data-tab="info">Info</button>
  </nav>
</header>

<main>
  <!-- HOME: klus-keuze -->
  <section id="view-home" class="view active">
    <div class="home-intro">Kies een klus</div>
    <div id="projectsList" class="projects-list"></div>
  </section>

  <!-- LIST VIEW -->
  <section id="view-list" class="view">
    <div class="filters">
      <div class="filter-row" id="dayChips"></div>
      <div class="filter-row">
        <button class="chip secondary active" data-status="all">Alles</button>
        <button class="chip secondary" data-status="todo">Nog doen</button>
        <button class="chip secondary" data-status="done">Gedaan</button>
      </div>
      <div class="filter-row">
        <button class="chip tag" data-priority="high">Must-have</button>
        <button class="chip tag" data-priority="normal">Overig</button>
        <button class="chip tag" data-priority="conditional">Conditioneel</button>
      </div>
      <div class="filter-row sort-row" id="whoRow"></div>
      <div class="filter-row sort-row">
        <span class="sort-label">Sorteer:</span>
        <button class="chip sort active" data-sort="time">Tijd</button>
        <button class="chip sort" data-sort="name">Naam</button>
        <button class="chip sort" data-sort="location">Locatie</button>
      </div>
    </div>
    <div id="actsList" class="acts-list"></div>
  </section>

  <!-- MAP VIEW -->
  <section id="view-map" class="view">
    <div class="image-wrap">
      <img id="mapImg" src="" alt="Plattegrond locaties" class="zoom-img" />
    </div>
    <div class="legend" id="mapLegend"></div>
  </section>

  <!-- TIMETABLE VIEW -->
  <section id="view-timetable" class="view">
    <div class="image-wrap">
      <img id="ttImg" src="" alt="Timetable" class="zoom-img" />
    </div>
  </section>

  <!-- INFO VIEW (bv. toestemmingslijst figuranten) -->
  <section id="view-info" class="view">
    <div class="legend" id="infoContent"></div>
  </section>
</main>

<!-- Modal voor notes/details -->
<div id="modal" class="modal hidden">
  <div class="modal-inner">
    <button id="modalClose" class="modal-close">×</button>
    <div id="modalPhoto" class="modal-photo hidden"></div>
    <h2 id="modalTitle"></h2>
    <div id="modalMeta" class="modal-meta"></div>
    <div id="modalSlots" class="modal-slots"></div>
    <div id="modalAssign" class="modal-assign"></div>
    <label class="notes-label">Notities</label>
    <textarea id="modalNotes" placeholder="Welke shots heb je? Welke hoeken? Etc."></textarea>
    <button id="modalSave" class="primary-btn">Opslaan</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
