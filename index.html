<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#09090c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&display=swap" rel="stylesheet" />
<title>Shootlist</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body class="home-mode">

<!-- Ambient glow achter alles -->
<div class="aura" aria-hidden="true"></div>

<header class="topbar">
  <div class="hero">
    <div class="hero-top">
      <button id="backBtn" class="icon-btn back-btn" title="Terug naar klussen" aria-label="Terug">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="appTitle">Shootlist</h1>
      <button id="resetBtn" class="icon-btn project-only" title="Alles resetten" aria-label="Resetten">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>

    <div class="hero-stats project-only">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 48 48" aria-hidden="true">
          <circle class="ring-bg" cx="24" cy="24" r="20"/>
          <circle id="ringFill" class="ring-fill" cx="24" cy="24" r="20"/>
        </svg>
        <span id="ringPct" class="ring-pct">0%</span>
      </div>
      <div class="stat-text">
        <div class="stat-line"><strong id="statShots">0</strong><span id="statShotsTotal">/ 0 shots</span></div>
        <div class="stat-sub" id="statActs">nog niets vastgelegd</div>
      </div>
      <span id="syncBadge" class="sync-badge"></span>
    </div>

    <div class="block-row project-only" id="dayChips"></div>
  </div>
</header>

<main>
  <!-- HOME: klus-keuze -->
  <section id="view-home" class="view active">
    <div class="home-intro" id="intro-label">Kies een klus</div>
    <nav class="seg home-tabs">
      <button class="seg-btn active" data-home-tab="active">Actief<span id="activeCount" class="seg-count"></span></button>
      <button class="seg-btn" data-home-tab="archive">Archief<span id="archiveCount" class="seg-count"></span></button>
    </nav>
    <div id="projectsList" class="projects-list"></div>
  </section>

  <!-- BRIEFING → KLUS -->
  <section id="view-build" class="view">
    <div class="build-wrap">
      <div class="field-row">
        <button id="buildIcon" class="icon-pick" aria-label="Kies een icoon">🎬</button>
        <input id="buildName" class="field" placeholder="Naam van de klus" autocomplete="off" />
      </div>
      <div id="iconRow" class="icon-row"></div>

      <label class="notes-label" for="buildSource">Briefing plakken</label>
      <textarea id="buildSource" class="field area" spellcheck="false"
        placeholder="# Locatie of draaidag&#10;## Onderdeel&#10;Shot die je wilt maken&#10;Nog een shot"></textarea>
      <div class="build-hint">
        <span><b>#</b> blok — locatie of draaidag</span>
        <span><b>##</b> onderdeel</span>
        <span>elke andere regel is een shot</span>
      </div>

      <div class="build-preview" id="buildPreview"></div>

      <div class="build-actions">
        <button id="buildDelete" class="ghost-danger hidden">Verwijderen</button>
        <button id="buildSave" class="primary-btn">Klus opslaan</button>
      </div>
    </div>
  </section>

  <!-- LIJST -->
  <section id="view-list" class="view">
    <div id="actsList" class="acts-list"></div>
  </section>

  <!-- PLATTEGROND -->
  <section id="view-map" class="view">
    <div class="image-wrap">
      <img id="mapImg" src="" alt="Plattegrond locaties" class="zoom-img" />
    </div>
    <div class="legend" id="mapLegend"></div>
  </section>

  <!-- TIMETABLE -->
  <section id="view-timetable" class="view">
    <div class="image-wrap">
      <img id="ttImg" src="" alt="Timetable" class="zoom-img" />
    </div>
  </section>

  <!-- INFO -->
  <section id="view-info" class="view">
    <div class="legend" id="infoContent"></div>
  </section>
</main>

<!-- Zwevende filterknop (alleen op de lijst) -->
<button id="filterToggle" class="filter-fab project-only" aria-label="Filters">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
  <span>Filters</span>
  <span id="filterCount" class="filter-count hidden"></span>
</button>

<!-- Filter-sheet -->
<div id="filterScrim" class="sheet-scrim"></div>
<div id="filterPanel" class="sheet">
  <div class="sheet-grip"></div>
  <div class="sheet-body">
    <div class="filter-row" id="statusRow"></div>
    <div class="filter-row">
      <span class="sort-label">Type</span>
      <button class="chip tag" data-priority="high">Must-have</button>
      <button class="chip tag" data-priority="normal">Overig</button>
      <button class="chip tag" data-priority="conditional">Conditioneel</button>
    </div>
    <div class="filter-row" id="whoRow"></div>
    <div class="filter-row">
      <span class="sort-label">Sorteer</span>
      <button class="chip sort active" data-sort="time">Tijd</button>
      <button class="chip sort" data-sort="name">Naam</button>
      <button class="chip sort" data-sort="location">Locatie</button>
    </div>
    <button id="filterDone" class="sheet-done">Klaar</button>
  </div>
</div>

<!-- Zwevende navigatie -->
<nav class="dock project-only" id="dock">
  <button class="dock-btn active" data-tab="list">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>
    <span>Lijst</span>
  </button>
  <button class="dock-btn" data-tab="map">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4L3 7v13l6-3 6 3 6-3V4l-6 3-6-3z"/><path d="M9 4v13M15 7v13"/></svg>
    <span>Kaart</span>
  </button>
  <button class="dock-btn" data-tab="timetable">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span>Tijden</span>
  </button>
  <button class="dock-btn" data-tab="info">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    <span>Info</span>
  </button>
</nav>

<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Detail-modal -->
<div id="modal" class="modal hidden">
  <div class="modal-inner">
    <button id="modalClose" class="modal-close" aria-label="Sluiten">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="modalPhoto" class="modal-photo hidden"></div>
    <h2 id="modalTitle"></h2>
    <div id="modalMeta" class="modal-meta"></div>
    <div id="modalSlots" class="modal-slots"></div>
    <div id="modalPlan" class="modal-plan"></div>
    <div id="modalAssign" class="modal-assign"></div>
    <label class="notes-label">Notities</label>
    <textarea id="modalNotes" placeholder="Welke shots heb je? Welke hoeken? Etc."></textarea>
    <button id="modalSave" class="primary-btn">Opslaan</button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
